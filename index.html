<!DOCTYPE html>
<html lang="es">
<!--
  ============================================================
  Matemática — shell: perfiles, menú de actividades y ajustes de padres
  Versión: v2.4 (2026-10-14)
  ------------------------------------------------------------
  Historial de cambios
  v2.4  Teoría de fracciones equivalentes
    + Las actividades de teoría (teoria:true en el registro) no aparecen en el panel de refuerzo de 4to:
      no tienen rondas ni niveles. Su resumen sale en Estadísticas con stats().
  v2.3  Fracciones de 4to
    + Ajustes de padres suma el mapa de fracciones de Ian (por tema: % al primer intento en 14 días, ítems,
      tendencia y último repaso) y el interruptor "Incluir ejercicios del módulo de la escuela".
    + El panel de estadísticas muestra también las siete actividades de fracciones y los nombres de sus errores.
  v2.2  Fondo global
    + Los fondos de la Tabla del 100 (Aurora, Océano, Bosque, Atardecer, Espacio) pasan al core
      (MATE.fondo, mate.global.fondo): se ven en el menú y en todas las actividades, también las de Ian.
    + Botón 🎨 arriba para elegirlo; el fondo viaja por la URL (?f=) como el tema.
  v2.1  Estadísticas del refuerzo de 4to
    + Ajustes de padres muestra el panel de estadísticas de las actividades de refuerzo de Ian
      (rondas, minutos, errores más frecuentes, hechos errados y lentos), permite fijar el nivel,
      reiniciar las estadísticas de una actividad y exportar todo en JSON.
  v2.0  Shell
    + Elegir perfil (Luz o Ian) y menú con las actividades de cada perfil.
    + Ajustes de padres con PIN (por defecto 1234): cambiar PIN y ver estadísticas.
    + Modo claro y oscuro con los tokens de core/core.css.
  ============================================================
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matemática</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/core.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;
  background:radial-gradient(circle at 20% 10%,var(--chip),transparent 50%),radial-gradient(circle at 85% 90%,var(--chip),transparent 50%),var(--bg)}
h1{margin:8px 0 4px;font-size:clamp(28px,6vw,44px)} h2{margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 24px;text-align:center}
.top{position:fixed;top:12px;right:12px;display:flex;gap:8px}
.icon-btn,.btn{font:inherit;color:var(--text);background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:14px;cursor:pointer;box-shadow:var(--shadow)}
.icon-btn{width:44px;height:44px;font-size:20px}
.btn{padding:10px 18px;font-weight:600}
.btn.main{background:var(--accent);color:#fff;border-color:transparent}
.grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:760px;width:100%}
.card{flex:1 1 220px;max-width:300px;padding:22px 16px;text-align:center;font:inherit;color:var(--text);cursor:pointer;
  background:var(--glass-strong);border:2px solid var(--glass-border);border-radius:22px;box-shadow:var(--shadow);transition:transform .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c,var(--accent));outline:none}
.card .big{font-size:56px;line-height:1.1} .card b{display:block;font-size:22px;margin-top:6px} .card small{color:var(--muted)}
.panel{background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:20px;box-shadow:var(--shadow);padding:20px;width:100%;max-width:460px;margin-bottom:16px}
input{font:inherit;color:var(--text);background:var(--box-bg);border:2px solid var(--glass-border);border-radius:12px;padding:10px 14px;width:100%;margin:6px 0;text-align:center;letter-spacing:.3em;font-size:22px}
.msg{min-height:1.4em;margin:6px 0;font-weight:600;text-align:center}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.panel.ancho{max-width:760px}
.ref4-perfil h3{margin:4px 0 10px}
.ref4-act{background:var(--chip);border-radius:14px;padding:8px 12px;margin:8px 0}
.ref4-act summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.ref4-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.ref4-grid div{background:var(--glass-strong);border-radius:12px;padding:6px 8px;text-align:center}
.ref4-grid b{display:block;font-size:22px} .ref4-grid small,.ref4-err small{color:var(--muted)}
.ref4-err{margin:4px 0 8px;padding-left:22px;line-height:1.4}
.ref4-dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ref4-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.ref4-acc select{font:inherit;color:var(--text);background:var(--box-bg);border:2px solid var(--glass-border);border-radius:10px;padding:6px}
.fr4-mapa{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0}
.fr4-mapa th,.fr4-mapa td{padding:5px 6px;border-bottom:1px solid var(--glass-border);text-align:center}
.fr4-mapa th:first-child,.fr4-mapa td:first-child{text-align:left}
.fr4-switch{display:flex;gap:10px;align-items:center;font-weight:600;margin:10px 0 2px;min-height:44px;cursor:pointer}
.fr4-switch input{width:24px;height:24px;margin:0}
.foot{margin-top:auto;padding-top:24px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="top">
  <button class="icon-btn" id="lockBtn" title="Ajustes de padres">🔒</button>
  <button class="icon-btn" id="fondoBtn" title="Elegir el fondo" aria-haspopup="menu">🎨</button>
  <button class="icon-btn" id="themeBtn" title="Cambiar modo claro u oscuro">🌙</button>
</div>
<h1>Matemática</h1>
<div id="view" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
<div class="foot">Matemática <span class="ver"></span></div>
<script src="core/core.js"></script>
<script src="perfiles.js"></script>
<script src="actividades/registro.js"></script>
<script src="actividades/_comun-4to/eventos.js"></script>
<script src="actividades/_comun-4to/panel-estadisticas.js"></script>
<script src="actividades/_comun-4to/fracciones-lib.js"></script>
<script src="actividades/_comun-4to/panel-fracciones.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), view=$('#view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.querySelectorAll('.ver').forEach(el=>el.textContent='v2.4');

/* ==== TEMA ==== */
function pintaTema(){ $('#themeBtn').textContent=MATE.tema.oscuro()?'☀️':'🌙'; }
$('#themeBtn').onclick=()=>{ MATE.tema.alternar(); pintaTema(); };
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',pintaTema);
pintaTema();
$('#fondoBtn').onclick=()=>MATE.fondo.menu($('#fondoBtn'));

/* ==== PERFILES ==== */
function verPerfiles(){
  MATE.setPerfil(null);
  view.innerHTML='<p class="sub">¿Quién va a jugar?</p><div class="grid">'+MATE.perfiles.map(p=>
    '<button class="card" data-p="'+esc(p.id)+'" style="--c:'+esc(p.color)+'"><span class="big">'+esc(p.avatar)+'</span><b>'+esc(p.nombre)+'</b><small>'+esc(p.grado)+' grado</small></button>').join('')+'</div>';
  view.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ MATE.setPerfil(b.dataset.p); verMenu(); });
}

/* ==== MENÚ ==== */
function verMenu(){
  const p=MATE.perfil(); if(!p) return verPerfiles();
  const acts=MATE.actividades.filter(a=>!a.perfiles||a.perfiles.includes(p.id));
  view.innerHTML='<p class="sub">¡Hola, '+esc(p.nombre)+'! '+esc(p.avatar)+' Elegí qué querés hacer.</p><div class="grid">'+
    (acts.length?acts.map(a=>'<button class="card" data-a="'+esc(a.id)+'" style="--c:'+esc(p.color)+'"><span class="big">'+esc(a.icono)+'</span><b>'+esc(a.titulo)+'</b><small>'+esc(a.descripcion)+'</small></button>').join(''):'<p class="sub">Todavía no hay actividades para vos.</p>')+
    '</div><div class="row"><button class="btn" id="cambiar">Cambiar de perfil</button></div>';
  view.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>MATE.abrir(b.dataset.a));
  $('#cambiar').onclick=verPerfiles;
}

/* ==== AJUSTES DE PADRES ==== */
const volver=()=>MATE.perfil()?verMenu():verPerfiles();
function verPin(){
  view.innerHTML='<div class="panel"><h2>🔒 Ajustes de padres</h2><p class="sub" style="margin-bottom:8px">Ingresá el PIN.</p>'+
    '<input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><div class="msg bad" id="m"></div>'+
    '<div class="row"><button class="btn" id="no">Volver</button><button class="btn main" id="ok">Entrar</button></div></div>';
  const go=()=>{ if(MATE.pin.check($('#pin').value)) verAjustes(); else { $('#m').textContent='PIN incorrecto'; $('#pin').value=''; } };
  $('#ok').onclick=go; $('#pin').onkeydown=e=>{ if(e.key==='Enter') go(); };
  $('#no').onclick=volver;
  $('#pin').focus();
}
function verAjustes(){
  const stats=MATE.actividades.filter(a=>typeof a.stats==='function');
  view.innerHTML='<div class="panel"><h2>Ajustes de padres</h2>'+
    '<b>Cambiar PIN</b><input id="np" type="password" inputmode="numeric" maxlength="8" placeholder="PIN nuevo" autocomplete="off"><div class="msg" id="m"></div>'+
    '<div class="row"><button class="btn main" id="gp">Guardar PIN</button></div></div>'+
    (stats.length||!window.REF4_PANEL?'<div class="panel"><h2>Estadísticas</h2>':'<div hidden>')+(stats.length?stats.map(a=>{ let r=''; try{ r=a.stats(); }catch(e){ r='(sin datos)'; } return '<p><b>'+esc(a.titulo)+'</b><br>'+esc(r)+'</p>'; }).join(''):'<p class="sub" style="margin:0">Todavía no hay estadísticas.</p>')+'</div>'+
    '<div class="panel ancho" id="ref4"></div><div class="panel ancho" id="fr4"></div><div class="row"><button class="btn" id="sal">Salir</button></div>';
  if(window.REF4_PANEL) REF4_PANEL.render($('#ref4'),{perfiles:MATE.perfiles,actividades:MATE.actividades.filter(a=>/^4to-/.test(a.id)&&!a.teoria)});
  else $('#ref4').remove();
  if(window.REF4_PANEL_FR) REF4_PANEL_FR.render($('#fr4'),{perfiles:MATE.perfiles,actividades:MATE.actividades});
  else $('#fr4').remove();
  $('#gp').onclick=()=>{ const v=$('#np').value, m=$('#m'); if(!/^\d{4,8}$/.test(v)){ m.className='msg bad'; m.textContent='Usá de 4 a 8 números.'; return; } MATE.pin.set(v); $('#np').value=''; m.className='msg ok'; m.textContent='PIN guardado'; };
  $('#sal').onclick=volver;
}
$('#lockBtn').onclick=verPin;

/* ==== INICIO ==== */
MATE.perfil()?verMenu():verPerfiles();
MATE.log('shell','listo');
})();
</script>
</body>
</html>
