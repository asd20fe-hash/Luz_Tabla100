<!DOCTYPE html>
<!--
  ============================================================
  Leé y contestá (lectura, 1er grado)
  Versión: v1.0.0 (2026-10-14). El historial de cambios está al principio de lectura.js
  ============================================================
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leé y contestá</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../core/core.css">
<link rel="stylesheet" href="../_comun-1ro/comun-1ro.css">
<style>
.lec-preg{font-size:clamp(24px,5.4vw,34px);font-weight:700;text-align:center;line-height:1.3;margin:4px 0 8px}
.lec-svg{width:100%;max-width:640px;height:auto;display:block;margin:0 auto;border-radius:18px}
.lec-fondo{fill:var(--l1-escena)} .lec-agua{fill:var(--l1-agua)} .lec-pasto{fill:var(--l1-pasto)} .lec-estante{fill:var(--l1-tecla-borde)}
.lec-onda{fill:none;stroke:rgba(255,255,255,.75);stroke-width:3;stroke-linecap:round}
.obj.tocable{cursor:pointer}
.obj.resalta{filter:drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 7px var(--accent));animation:lec-brilla 1s ease-in-out infinite}
.obj.malo{opacity:.35}
@keyframes lec-brilla{50%{filter:drop-shadow(0 0 1px var(--accent))}}
.lec-nums{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:520px;margin:10px auto 0}
.lec-nums .l1-tecla{min-height:58px;font-size:30px}
.lec-nums .l1-tecla[disabled]{opacity:.3}
.lec-sino{min-width:120px;min-height:64px;font-size:28px;font-family:"Andika",var(--font)}
.esc-modelo{text-align:center}
.esc-modelo .l1-sil{font-size:34px}
@media (prefers-reduced-motion: reduce){.obj.resalta{animation:none}}
</style>
</head>
<body>
<header class="l1-barra">
  <button class="l1-btn" id="volver" title="Volver al menú">🏠</button>
  <h1 id="titulo">Leé y contestá</h1>
  <span class="l1-ver" id="ver"></span>
  <button class="l1-btn l1-caso" id="caso">ABC</button>
  <button class="l1-btn" id="sonido" title="Sonido" aria-pressed="true">🔊</button>
  <button class="l1-btn" id="fondo" title="Elegir el fondo" aria-haspopup="menu">🎨</button>
  <button class="l1-btn" id="tema" title="Cambiar modo claro u oscuro">🌙</button>
</header>
<main id="app"></main>
<script src="../../core/core.js"></script>
<script src="../../perfiles.js"></script>
<script src="../registro.js"></script>
<script src="../_comun-4to/azar.js"></script>
<script src="../_comun-4to/eventos.js"></script>
<script src="../_comun-4to/ui-comun.js"></script>
<script src="../_comun-1ro/lengua.js"></script>
<script src="../_comun-1ro/repaso.js"></script>
<script src="../_comun-1ro/ui-1ro.js"></script>
<script src="lectura-logica.js"></script>
<script src="lectura.js"></script>
</body>
</html>
