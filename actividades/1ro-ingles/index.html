<!DOCTYPE html>
<!--
  ============================================================
  English (inglés, 1er grado)
  Versión: v1.0.1 (2026-10-15). El historial de cambios está al principio de ingles.js
  ============================================================
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../core/core.css">
<link rel="stylesheet" href="../_comun-1ro/comun-1ro.css">
<style>
.ing-inicio{text-align:center;padding:30px 14px}
.ing-bandera{font-size:64px}
.ing-inicio h2{font-size:44px;margin:6px 0 14px}
.ing-play{font-size:26px;min-height:64px;padding:8px 28px}
.ing-instr{font-size:26px;font-weight:700;text-align:center;margin:2px 0}
.ing-oir{font-size:22px;min-height:56px}
.ing-ops{display:grid;gap:12px;max-width:640px;margin:10px auto}
.ing-ops.n3{grid-template-columns:repeat(3,1fr)} .ing-ops.n4{grid-template-columns:repeat(2,1fr)}
.ing-op{min-height:130px;border-radius:22px;border:3px solid var(--l1-tecla-borde);background:var(--l1-tecla);cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 var(--l1-tecla-borde);touch-action:manipulation}
.ing-op:active{transform:translateY(2px);box-shadow:none}
.ing-op.mal{opacity:.35;border-color:var(--bad)}
.ing-op.bien,.ing-pal.bien{border-color:var(--ok);background:var(--l1-ok-bg);box-shadow:0 0 0 4px var(--ok)}
.ing-pal.mal{opacity:.35}
.ing-dib{font-size:76px;line-height:1}
.ing-dib.grande{font-size:min(130px,30vw)}
.ing-dib.color{display:inline-block;width:84px;height:84px;border-radius:50%;border:4px solid var(--l1-trazo);font-size:0}
.ing-dib.color.grande{width:140px;height:140px}
.ing-dib.num{font-family:"Andika",var(--font);font-weight:700;color:var(--l1-tinta)}
.ing-centro{text-align:center;margin:8px 0}
.ing-palabras{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:520px;margin:8px auto}
.ing-pal{font-size:30px;min-height:64px}
.ing-sino{font-size:28px;min-width:140px;min-height:66px}
.ing-trad{font-size:30px;text-align:center;margin:8px 0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.ing-trad .ing-dib{font-size:44px}.ing-trad .ing-dib.color{width:44px;height:44px}
@media (max-width:480px){.ing-op{min-height:104px}.ing-dib{font-size:60px}}
</style>
</head>
<body>
<header class="l1-barra">
  <button class="l1-btn" id="volver" title="Volver al menú">🏠</button>
  <h1 id="titulo">English</h1>
  <span class="l1-ver" id="ver"></span>
  <button class="l1-btn l1-caso" id="caso">ABC</button>
  <button class="l1-btn" id="sonido" title="Sonido" aria-pressed="true">🔊</button>
  <button class="l1-btn" id="fondo" title="Elegir el fondo" aria-haspopup="menu">🎨</button>
  <button class="l1-btn" id="tema" title="Cambiar modo claro u oscuro">🌙</button>
</header>
<main id="app"></main>
<script src="../../core/core.js"></script>
<script src="../../perfiles.js"></script>
<script src="../registro.js"></script>
<script src="../_comun-4to/azar.js"></script>
<script src="../_comun-4to/eventos.js"></script>
<script src="../_comun-4to/ui-comun.js"></script>
<script src="../_comun-1ro/lengua.js"></script>
<script src="../_comun-1ro/repaso.js"></script>
<script src="../_comun-1ro/ui-1ro.js"></script>
<script src="ingles-logica.js"></script>
<script src="ingles.js"></script>
</body>
</html>
